<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
  >

  <title>EoE Photo Frame</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="app">

<div class="header-banner">
  <img
    src="assets/header.png"
    alt="Soak in Ecstasy of Enlightenment with Sadhguru — Create Your Own Photo Frame"
  >
</div>

    <button id="photoButton">
  Add Your Photo
</button>

<div
  class="photo-choice"
  id="photoChoice"
  hidden
>
  <button
    type="button"
    id="cameraButton"
  >
    Take a Photo
  </button>

  <button
    type="button"
    id="galleryButton"
  >
    Choose from Gallery
  </button>
</div>

<input
  type="file"
  id="cameraInput"
  accept="image/*"
  capture="user"
  hidden
>

<input
  type="file"
  id="galleryInput"
  accept="image/*"
  hidden
>

    <div class="editor">

      <!-- Your original artwork -->
      <img
        src="assets/eoe-template.png"
        alt="EoE Jaipur graphic"
        class="template-image"
        id="templateImage"
      >

      <!-- Circular photo area -->
      <div
        class="photo-window"
        id="photoWindow"
      >

        <div
          class="photo-placeholder"
          id="photoPlaceholder"
        >
          Add Your Photo
        </div>

        <img
          id="userPhoto"
          alt="Your photo"
        >

      </div>

    </div>

    <div class="zoom-control">

      <label for="zoomSlider">
        Adjust photo
      </label>

      <input
        type="range"
        id="zoomSlider"
        min="1"
        max="3"
        step="0.01"
        value="1"
      >

    </div>

    <p class="helper-text">
      Drag your photo to adjust
    </p>

    <button
      id="generateButton"
      class="generate-button"
      disabled
    >
      Generate My Graphic
    </button>

    <p
      id="downloadMessage"
      class="download-message"
    ></p>

  </main>

  <script src="script.js"></script>

</body>
</html>
